name: GRIOS Data Hub Contract Tests

on:
  push:
    branches:
      - main
      - issue-11-data-coverage-hub
  pull_request:
    branches:
      - main
    paths:
      - "data_coverage.py"
      - "supabase/migrations/**"
      - "tests/**"
      - "scanner.py"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest httpx python-dotenv
      - run: python -m py_compile scanner.py data_coverage.py
      - run: python -m pytest -q

