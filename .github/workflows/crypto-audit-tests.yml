name: GRIOS Crypto Audit Tests

on:
  push:
    branches:
      - main
      - v15-crypto-audit-integration
  pull_request:
    branches:
      - main
    paths:
      - "scanner.py"
      - "cftc_cot.py"
      - "README.md"
      - "tests/**"
      - ".github/workflows/crypto-audit-tests.yml"
      - ".github/workflows/grios-cftc-positioning.yml"

permissions:
  contents: read

jobs:
  crypto-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest httpx python-dotenv

      - name: Compile scanner and CFTC adapter
        run: python -m py_compile scanner.py cftc_cot.py

      - name: Run test suite
        run: python -m pytest -q
