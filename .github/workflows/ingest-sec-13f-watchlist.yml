name: Ingest SEC 13F Institutional Watchlist

on:
  workflow_dispatch:
    inputs:
      report_period:
        description: "13F report period (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ingest-sec-13f-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      GRIOS_DATA_HUB_URL: ${{ vars.GRIOS_DATA_HUB_URL }}
      GRIOS_INGEST_TOKEN: ${{ secrets.GRIOS_INGEST_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency
        run: python -m pip install --upgrade httpx

      - name: Ingest configured institutional watchlist
        env:
          GITHUB_SHA: ${{ github.sha }}
          REPORT_PERIOD: ${{ inputs.report_period }}
        run: |
          python scripts/ingest_sec_13f_watchlist.py \
            --report-period "$REPORT_PERIOD" \
            --watchlist config/sec_13f_watchlist.json \
            --output-dir artifacts/sec-13f-watchlist/reports \
            --database artifacts/sec-13f-watchlist/registry.sqlite3 \
            --summary artifacts/sec-13f-watchlist/summary.json

      - name: Upload institutional 13F audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-13f-watchlist-${{ inputs.report_period }}
          path: artifacts/sec-13f-watchlist/
          if-no-files-found: ignore
          retention-days: 90
